name: Wizard release gate
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wizard-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  full-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install locked dependencies and browser
        run: |
          python -m pip install -r backend/requirements.txt -c backend/requirements.lock pytest==9.0.2
          npm ci --prefix frontend
          cd frontend
          npx playwright install --with-deps chromium
      - name: Verify immutable production candidate
        run: python scripts/run-release-gate.py
      - name: Preserve all success and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wizard-release-evidence
          path: backend/test-output/release-gates
          retention-days: 14
