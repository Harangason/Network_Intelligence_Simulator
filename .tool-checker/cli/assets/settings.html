<section id="tool-checker-settings" aria-label="Tool Checker Einstellungen">
  <h2>🔍 Tool Checker</h2>
  <p id="tc-project"></p>
  <form id="tc-form">
    <div class="viz-controls">
      <label class="form-label">Archivieren nach Abschluss (Tage)
        <input class="form-control" id="tc-archive" type="number" min="1" max="3650" step="1" required>
      </label>
      <label class="form-label">Löschen nach Archivierung (Tage)
        <input class="form-control" id="tc-delete" type="number" min="1" max="3650" step="1" required>
      </label>
    </div>
    <p id="tc-summary" aria-live="polite"></p>
    <p class="text-muted">Geschützte und aktive Läufe bleiben erhalten. Wartung bei Skill-Nutzung.</p>
    <button class="btn btn-primary" type="submit">Übernehmen</button>
    <p id="tc-status" role="status">Gespeicherte Werte geladen.</p>
    <label id="tc-fallback-label" class="form-label" hidden>Auftrag zum Kopieren
      <textarea id="tc-fallback" class="form-control" readonly rows="5"></textarea>
    </label>
  </form>
</section>
<script>
(() => {
  const data = __TOOL_CHECKER_SETTINGS__;
  const root = document.getElementById('tool-checker-settings');
  const field = id => root.querySelector('#'+id);
  const archive = field('tc-archive'), deletion = field('tc-delete');
  field('tc-project').textContent = data.project;
  archive.value = data.retention.archive_after_days;
  deletion.value = data.retention.delete_after_archive_days;
  function update() {
    field('tc-summary').textContent = `Archivierung nach mehr als ${archive.value} Tagen · Löschung nach weiteren ${deletion.value} Tagen im Archiv.`;
  }
  root.addEventListener('input', () => { update(); field('tc-status').textContent='Änderungen noch nicht gespeichert.'; });
  field('tc-form').addEventListener('submit', async event => {
    event.preventDefault();
    if (!field('tc-form').reportValidity()) return;
    const retention = {archive_after_days:Number(archive.value), delete_after_archive_days:Number(deletion.value)};
    const prompt = 'Speichere diese Tool-Checker-Aufbewahrungseinstellungen für das genannte Projekt mit dem settings.py-Helfer. Prüfe die gespeicherten Werte. Keine Wartung oder Löschung jetzt ausführen. Konfiguration: '+JSON.stringify({project:data.project,retention});
    const fallback = () => {field('tc-fallback-label').hidden=false;field('tc-fallback').value=prompt;field('tc-status').textContent='Nicht gespeichert. Auftrag kopieren und im Chat senden.';};
    if (!window.openai?.sendFollowUpMessage) { fallback(); return; }
    try {
      await window.openai.sendFollowUpMessage({prompt,title:'Tool-Checker-Einstellungen übernehmen'});
      field('tc-status').textContent='Auftrag übergeben. Speicherbestätigung folgt im Chat.';
    } catch (_) { fallback(); }
  });
  update();
})();
</script>
