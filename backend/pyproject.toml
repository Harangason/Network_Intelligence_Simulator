[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = [".."]
namespaces = false
include = ["backend", "backend.*"]
exclude = ["backend.tests", "backend.tests.*", "backend.runtime", "backend.runtime.*", "backend.backend", "backend.backend.*", "backend.test-output*", "backend.build*"]

[tool.setuptools.package-data]
"backend.nis" = ["**/*.json"]

[project]
name = "communication-simulator"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "ijson==3.4.0.post0",
    "flask>=3.1.2",
    "openai>=2.43.0",
    "httpx>=0.28.0",
    "mcp>=2.1,<3",
    "jsonschema>=4.23,<5",
    "psycopg[binary,pool]>=3.3.4",
    "python-can>=4.6.1",
    "asammdf==8.8.11",
    "dpkt==1.9.8",
    "pyyaml>=6.0.3",
    "waitress>=3.0.2",
    "numpy>=2.0,<2.5",
    "cupy-cuda13x[ctk]>=14.2,<15",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
